<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>habit tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        table {
            border-collapse: collapse;
            width: 200%;
            max-width: 900px;
        }

        th, td {
            border: 1px solid #000;
            padding: 6px;
            text-align: left;
            vertical-align: top;
        }

        tr:first-child th:nth-child(2) {
            width: 500px;
            padding: 8px;
        }

        .month-select {
            width: 100%;
            margin-bottom: 2px;
            padding: 4px;
            font-size: 14px;
        }

        .mini-calendar {
            width: 25%;
            border-collapse: collapse;
            margin-top: 1px;
        }

        .mini-calendar td {
            width: 20%;
            height: 100%;
            text-align: center;
            padding: 6px 2px;
            font-size: 12px;
        }

        input {
            width: 95%;
            padding: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>my Habit</th>
            <th>
                <select class="month-select">
                    <option>january</option>
                    <option>february</option>
                    <option>march</option>
                    <option>april</option>
                    <option>may</option>
                    <option>june</option>
                    <option>july</option>
                    <option>august</option>
                    <option>september</option>
                    <option>october</option>
                    <option>november</option>
                    <option>december</option>
                </select>

                <table class="mini-calendar">
                    <tr>
                        <td>1</td>
                        <td>2</td>
                        <td>4</td>
                        <td>5</td>
                        <td>6</td>
                    </tr>
                </table>
            </th>
        </tr>
        <tr><td><input type="text" placeholder="Wake up at 5:00 AM"></td><td></td></tr>
        <tr><td><input type="text" placeholder="Workout"></td><td></td></tr>
        <tr><td><input type="text" placeholder="medation/breathing"></td><td></td></tr>
        <tr><td><input type="text" placeholder="Day planing"></td><td></td></tr>
        <tr><td><input type="text" placeholder="Project Work"></td><td></td></tr>
        <tr><td><input type="text" placeholder="Content creation"></td><td></td></tr>
        <tr><td><input type="text" placeholder="Skill Learning"></td><td></td></tr>
        <tr><td><input type="text" placeholder="complete H.W"></td><td></td></tr>
    </table>
</body>
</html>
